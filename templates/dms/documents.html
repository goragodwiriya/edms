<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-documents" data-i18n>{LNG_List of} {LNG_Document}</h1>
            <p data-i18n>Document management system</p>
          </div>
        </header>
        <div class="content-body">
          <form data-table-filter="dmsDocuments" class="table_nav">
            <div>
              <label for="dms_documents_pagesize" data-i18n>Show</label>
              <span class="form-control">
                <select name="pageSize" id="dms_documents_pagesize">
                  <option value="10" data-i18n>10 {LNG_entries}</option>
                  <option value="25" data-i18n>25 {LNG_entries}</option>
                  <option value="50" data-i18n>50 {LNG_entries}</option>
                  <option value="100" data-i18n>100 {LNG_entries}</option>
                </select>
              </span>
            </div>
            <div>
              <label for="dms_documents_from" data-i18n>From</label>
              <span class="form-control">
                <input type="date" name="from" id="dms_documents_from">
              </span>
            </div>
            <div>
              <label for="dms_documents_to" data-i18n>To</label>
              <span class="form-control">
                <input type="date" name="to" id="dms_documents_to">
              </span>
            </div>
            <div>
              <label for="dms_documents_cabinet" data-i18n>Cabinet</label>
              <span class="form-control">
                <select name="cabinet" id="dms_documents_cabinet">
                  <option value="" data-i18n>{LNG_All items}</option>
                </select>
              </span>
            </div>
            <input type="search" name="search" placeholder="{LNG_Search}..." data-i18n>
          </form>
          <div class="tablebody">
            <table class="table border fullwidth" data-table="dmsDocuments" data-source="api/dms/documents" data-default-sort="create_date desc"
                   data-page-size="25" data-load-query-params="true" data-row-actions='{
                     "download": {
                       "label": "Download",
                       "className": "btn btn-purple icon-download",
                       "url": "api/dms/download?id={file_id}",
                       "method": "GET",
                       "target": "_blank",
                       "condition": "is_url == 0 && file_id > 0"
                     },
                     "url": {
                       "label": "URL",
                       "className": "btn btn-primary icon-world",
                       "url": "api/dms/download/url?id={dms_id}",
                       "method": "GET",
                       "target": "_blank",
                       "condition": "is_url == 1"
                     },
                     "detail": {
                       "label": "Detail",
                       "className": "btn btn-orange icon-info",
                       "url": "api/dms/detail/get",
                       "method": "GET",
                       "navigate": false,
                       "params": {"id": "{dms_id}"}
                     }
                   }'>
              <thead>
                <tr>
                  <th data-field="create_date" data-sort="create_date" data-format="date" data-cell-class="nowrap" data-i18n>{LNG_Date}</th>
                  <th data-field="document_no" data-sort="document_no" data-cell-class="nowrap" data-i18n>{LNG_Document No.}</th>
                  <th data-field="topic" data-sort="topic" data-template="<span class='two_line'>${topic}</span>" data-i18n>{LNG_Document title}</th>
                  <th data-field="file_name" data-template="<span class='two_line'>${file_name}</span>" data-i18n>{LNG_File name}</th>
                  <th data-field="ext" data-formatter="formatDmsExt" class="center" data-cell-class="center"></th>
                  <th data-field="downloaded" data-formatter="formatDmsDownloaded" class="center" data-cell-class="center"></th>
                  <th data-field="department" class="center" data-cell-class="center" data-template="<span class='two_line'>${department}</span>" data-i18n>{LNG_Department}</th>
                  <th data-field="cabinet" class="center" data-cell-class="center nowrap" data-i18n>{LNG_Cabinet}</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 Admin Framework - Powered by <a href="https://nowjs.net">Now.js</a></p>
  </footer>
</div>
